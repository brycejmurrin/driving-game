<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon Drift">
<meta name="theme-color" content="#070a18">
<title>Neon Drift</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="hud-col">
    <div class="hud-label">SCORE</div>
    <div id="score" class="hud-value">0</div>
  </div>
  <div class="hud-col">
    <div class="hud-label">HIGH SCORE</div>
    <div id="hiscore" class="hud-value">0</div>
  </div>
  <div class="hud-col">
    <div class="hud-label">LAP</div>
    <div id="lap" class="hud-value">-</div>
  </div>
  <div class="hud-col">
    <div class="hud-label">POS</div>
    <div id="pos" class="hud-value">-</div>
  </div>
</div>

<div id="announce"></div>

<button id="pausebtn" hidden>&#10074;&#10074;</button>
<div id="pausemenu" hidden>
  <h2>PAUSED</h2>
  <button id="pm-resume">RESUME</button>
  <button id="pm-restart">RESTART RACE</button>
  <button id="pm-tilt">TILT: ON</button>
  <button id="pm-calib">RECALIBRATE TILT</button>
  <button id="pm-sound">SOUND: ON</button>
  <button id="pm-quit">QUIT TO MENU</button>
</div>

<div id="overlay">
  <h1 id="title">NEON&nbsp;DRIFT</h1>
  <p id="subtitle">Tilt your phone to steer &middot; grab coins &middot; hit boost pads</p>
  <div id="trackselect" hidden></div>
  <p id="prompt">TAP TO START</p>
  <p id="audiostate"></p>
</div>

<button id="soundbtn" hidden>&#9834; ON</button>
<button id="firebtn" hidden></button>
<button id="driftbtn" hidden>DRIFT</button>
<button id="steerleft" hidden>&#9664;</button>
<button id="steerright" hidden>&#9654;</button>

<div id="nogl" hidden>
  <p>Sorry &mdash; your browser does not support WebGL.</p>
</div>

<script src="js/renderer.js?v=9"></script>
<script src="js/input.js?v=9"></script>
<script src="js/tracks.js?v=9"></script>
<script src="js/sprites.js?v=9"></script>
<script src="js/audio.js?v=9"></script>
<script src="js/game.js?v=9"></script>
</body>
</html>
